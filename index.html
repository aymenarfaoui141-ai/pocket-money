<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#14201d;--mut:#62706c;--ac:#0f766e;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--line:#e2e8e6;--soft:#eef3f1}
@media (prefers-color-scheme:dark){:root{--bg:#0c1311;--card:#151f1c;--tx:#e8efed;--mut:#93a39f;--line:#24312d;--soft:#1b2724;--ac:#14b8a6}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px;-webkit-tap-highlight-color:transparent}
header{padding:16px 16px 0;max-width:560px;margin:0 auto}
header h1{font-size:20px;margin:0}
main{padding:4px 12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;border:0}
.hero .mut{color:#cdeae5}
.big{font-size:34px;font-weight:750;letter-spacing:-.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.mini b{display:block;font-size:16px}
.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;border-radius:6px}
h2{font-size:15px;margin:18px 4px 4px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button.on{color:var(--ac);font-weight:700}
nav .ico{font-size:21px;line-height:1.2}
nav .plus .ico{background:var(--ac);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:24px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font:inherit;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
textarea{font-family:ui-monospace,monospace;font-size:12px;min-height:120px}
.amount{font-size:28px;font-weight:700;text-align:center}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--tx)}
.chk input{width:20px;height:20px;margin:0;flex:none}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:16px;margin-top:14px;text-align:center}
.btn.sec{background:var(--soft);color:var(--tx)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:9px;font-size:14px;margin-top:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap;font-weight:600}
.p1{background:#fee2e2;color:#991b1b}.p2{background:#fef3c7;color:#92400e}.p3{background:#dbeafe;color:#1e40af}
.hb{background:#ede9fe;color:#5b21b6}.urg{background:#fee2e2;color:#991b1b}
.alert{border-left:4px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)}
.alert.info{border-left-color:var(--ac)}
.mut{color:var(--mut);font-size:13px}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .l{flex:1;min-width:0}
.tx .l b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{background:none;border:0;color:var(--mut);font-size:16px;padding:6px}
.del.confirm{color:#fff;background:var(--bad);border-radius:8px;font-size:12px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sugg td{padding:4px 2px}
table{width:100%;border-collapse:collapse;font-size:14px}
.prev div{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.o3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;z-index:9;font-size:14px}
#toast.show{opacity:1}
#lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center}
.lockin{display:flex;flex-direction:column;align-items:center;padding:20px}
.dots{display:flex;gap:14px;margin:22px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ac)}.dots i.on{background:var(--ac)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:24px;font-weight:600}
.lnk{background:none;border:0;color:var(--ac);font:inherit;margin:18px 0 8px}
[hidden]{display:none!important}
</style>

<body>
<header><div class="row"><h1 style="display:flex;align-items:center;gap:8px"><img src="icon-192.png" alt="" width="30" height="30" style="border-radius:8px">Pocket Money</h1><span class="mut" id="today"></span></div></header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="home" class="on"><span class="ico">🏠</span>Accueil</button>
  <button data-tab="hist"><span class="ico">🧾</span>Historique</button>
  <button data-tab="add" class="plus"><span class="ico">+</span>Déclarer</button>
  <button data-tab="stats"><span class="ico">📊</span>Analyse</button>
  <button data-tab="set"><span class="ico">⚙️</span>Réglages</button>
</nav>
<div id="toast"></div>
<script>
"use strict";
const KEY='monBudget_v1', DAY=86400000;
let storageOK=true;
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r3=n=>Math.round(n*1000)/1000;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(r3(n)).toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3})+' dt';
const num=v=>{const x=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(x)?x:NaN};
function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function tsFor(date){if(date===todayISO())return Date.now();const n=new Date();const t=new Date(date+'T'+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0')).getTime();return isFinite(t)?t:Date.now()}
const fdate=d=>{try{return new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}catch(e){return d}};

/* ---------- données ---------- */
function initial(m,box,inv){
  const now=Date.now();
  const s={v:1,investPct:isFinite(inv)?inv:10,refundPct:5,investInit:box>0?r3(box):0,created:now,lastAdjust:now,lastBackup:0,tx:[],objets:[
    {id:'transport',nom:'Transport',pct:42,prio:1},
    {id:'repas',nom:'Repas et café hors maison',pct:25,prio:1},
    {id:'coiffeur',nom:'Coiffeur',pct:8,prio:2},
    {id:'imprevus',nom:'Imprévus et objets ponctuels',pct:5,prio:2,imprevu:true},
    {id:'sorties',nom:'Sorties et loisirs',pct:7,prio:3},
    {id:'dons',nom:'Dons',pct:3,prio:3}
  ]};
  if(m>0)s.tx.push({id:uid(),ts:now,date:todayISO(),type:'revenu',montant:r3(m),hors:false,note:'Solde de départ',alloc:allocate(s,r3(m),0)});
  return s;
}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){storageOK=false;return null}}
function save(){if(!S)return;try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
let S;

const sumPct=s=>s.objets.reduce((a,o)=>a+(+o.pct||0),0);
const objById=id=>S.objets.find(o=>o.id===id);
const impObj=()=>S.objets.find(o=>o.imprevu)||S.objets[0];

function splitPct(s,net){
  const sum=sumPct(s),obj={};if(!(net>0))return obj;
  if(sum>0){s.objets.forEach(o=>{if(+o.pct>0)obj[o.id]=r3(net*o.pct/sum)})}
  else{const i=s.objets.find(o=>o.imprevu)||s.objets[0];if(i)obj[i.id]=r3(net)}
  const diff=r3(net-Object.values(obj).reduce((a,b)=>a+b,0));
  if(diff!==0){const k=Object.keys(obj).sort((a,b)=>obj[b]-obj[a])[0];if(k)obj[k]=r3(obj[k]+diff)}
  return obj;
}
function allocate(s,m,dette,remb,outs){
  remb=r3(Math.max(0,Math.min(remb||0,m)));
  const base=r3(m-remb);
  const invest=r3(base*s.investPct/100);
  const refund=r3(Math.min(dette,base*s.refundPct/100));
  const obj=splitPct(s,r3(base-invest-refund));
  const dettes={};let left=remb;
  for(const [q,v] of (outs||[])){if(left<=0.0005)break;const t=r3(Math.min(v,left));if(t>0){dettes[q]=t;left=r3(left-t)}}
  return {invest,refund,obj,dettes};
}

function compute(s){
  const raw={},alloue={},dep={},depUrg={};
  s.objets.forEach(o=>{raw[o.id]=0;alloue[o.id]=0;dep[o.id]=0;depUrg[o.id]=0});
  let boite=+s.investInit||0,aMettre=0,dette=0,urgTot=0,theo=0;
  const debts={},first={};
  const fallback=(s.objets.find(o=>o.imprevu)||s.objets[0]||{}).id;
  const add=(k,v,al)=>{const id=(k in raw)?k:fallback;if(id){raw[id]+=v;if(al)alloue[id]+=v}};
  for(const t of [...s.tx].sort((a,b)=>a.ts-b.ts)){
    if(t.hors)continue;
    if(t.type==='revenu')theo+=t.montant-Object.values((t.alloc&&t.alloc.dettes)||{}).reduce((x,y)=>x+y,0);
    else if(t.type==='depense'&&!t.urgence)theo-=t.montant;
    else if(t.type==='depot'||t.type==='rembDette'||(t.type==='epargne'&&t.fromSolde))theo-=t.montant;
    else if(t.type==='emprunt')theo+=t.montant;
    if(t.type==='revenu'){
      const a=t.alloc||{invest:0,refund:0,obj:{}};
      for(const k in a.obj)add(k,a.obj[k],true);
      aMettre+=a.invest+a.refund;dette=Math.max(0,dette-a.refund);
      for(const q in (a.dettes||{}))debts[q]=(debts[q]||0)-a.dettes[q];
    }else if(t.type==='depense'){
      if(t.urgence){boite-=t.montant;dette+=t.montant;urgTot+=t.montant;if(t.obj in depUrg)depUrg[t.obj]+=t.montant}
      else{add(t.obj,-t.montant,false);const id=(t.obj in dep)?t.obj:fallback;if(id)dep[id]+=t.montant}
    }else if(t.type==='reeq'){for(const k in t.delta)if(k in raw){raw[k]+=t.delta[k];alloue[k]+=t.delta[k]}}
    else if(t.type==='depot'){boite+=t.montant;aMettre-=(t.pourDu!=null?t.pourDu:t.montant);for(const k in (t.delta||{}))add(k,t.delta[k],false)}
    else if(t.type==='epargne'){boite+=t.montant;for(const k in (t.delta||{}))add(k,t.delta[k],false)}
    else if(t.type==='emprunt'){for(const k in (t.alloc||{}))add(k,t.alloc[k],true);debts[t.qui]=(debts[t.qui]||0)+t.montant;if(!(t.qui in first))first[t.qui]=t.ts}
    else if(t.type==='rembDette'){for(const k in (t.delta||{}))add(k,t.delta[k],false);debts[t.qui]=(debts[t.qui]||0)-t.montant}
  }
  aMettre=Math.max(0,r3(aMettre));
  {const cur=Object.values(raw).reduce((a,b)=>a+b,0)+aMettre,corr=r3(theo-cur);
   if(corr!==0&&Math.abs(corr)<0.05&&fallback)raw[fallback]=r3(raw[fallback]+corr)}
  const dettesList=Object.keys(debts).filter(q=>debts[q]>0.0005).sort((a,b)=>(first[a]||0)-(first[b]||0)).map(q=>[q,r3(debts[q])]);
  const detteExt=r3(dettesList.reduce((a,x)=>a+x[1],0));
  const invest=boite;
  // couverture des dépassements : Imprévus d'abord, puis priorité 3, puis priorité 2
  const eff={...raw},transfers=[];
  const deficits=s.objets.filter(o=>eff[o.id]<-0.0005).sort((a,b)=>a.prio-b.prio);
  for(const d of deficits){
    let need=-eff[d.id];
    const donors=s.objets.filter(o=>o.id!==d.id&&(o.imprevu||o.prio>=2)&&eff[o.id]>0)
      .sort((a,b)=>(b.imprevu?1:0)-(a.imprevu?1:0)||b.prio-a.prio||eff[b.id]-eff[a.id]);
    for(const o of donors){if(need<=0.0005)break;const take=Math.min(need,eff[o.id]);eff[o.id]-=take;eff[d.id]+=take;need-=take;transfers.push({from:o.id,to:d.id,m:take})}
  }
  const dispo=Object.values(raw).reduce((a,b)=>a+b,0);
  const deficit=-Object.values(eff).filter(v=>v<0).reduce((a,b)=>a+b,0);
  return {raw,eff,alloue,dep,depUrg,invest,boite,aMettre,dette,dispo,deficit,transfers,urgTot,dettesList,detteExt};
}

function perDay(){
  const deps=S.tx.filter(t=>t.type==='depense'&&!t.hors&&!t.urgence);
  if(!deps.length)return {v:9,est:true};
  const first=Math.min(...deps.map(t=>t.ts)),days=(Date.now()-first)/DAY;
  if(days<3)return {v:9,est:true};
  return {v:deps.reduce((a,t)=>a+t.montant,0)/days,est:false};
}

function suggestion(){
  if(Date.now()-S.lastAdjust<7*DAY)return null;
  const deps=S.tx.filter(t=>t.type==='depense'&&!t.hors&&t.ts>=S.lastAdjust);
  if(deps.length<5)return null;
  const tot=deps.reduce((a,t)=>a+t.montant,0);if(tot<=0)return null;
  const sum=sumPct(S),by={};deps.forEach(t=>by[t.obj]=(by[t.obj]||0)+t.montant);
  const sug=S.objets.map(o=>({id:o.id,nom:o.nom,cur:+o.pct,real:(by[o.id]||0)/tot*sum,sug:Math.round((+o.pct+(by[o.id]||0)/tot*sum)/2)}));
  const d=Math.round(sum-sug.reduce((a,x)=>a+x.sug,0));
  if(d!==0){const top=[...sug].sort((a,b)=>b.sug-a.sug)[0];top.sug+=d}
  if(sug.every(x=>Math.abs(x.sug-x.cur)<1))return null;
  return sug;
}

function fixSum(delta,target){
  const ks=Object.keys(delta);if(!ks.length)return delta;
  const d=r3(target-ks.reduce((a,k)=>a+delta[k],0));
  if(d!==0){const k=ks.sort((a,b)=>Math.abs(delta[b])-Math.abs(delta[a]))[0];delta[k]=r3(delta[k]+d)}
  return delta;
}
function rebalance(note){
  const c=compute(S);if(c.dispo<=0)return false;
  const sum=sumPct(S);if(sum<=0)return false;
  const delta={};S.objets.forEach(o=>{delta[o.id]=r3(c.dispo*(+o.pct||0)/sum-c.raw[o.id])});
  fixSum(delta,0);
  S.tx.push({id:uid(),ts:Date.now(),date:todayISO(),type:'reeq',delta,hors:false,note:note||'Rééquilibrage du disponible'});
  return true;
}

function takeFrom(m){
  const c=compute(S),pos=S.objets.filter(o=>c.raw[o.id]>0),tot=pos.reduce((a,o)=>a+c.raw[o.id],0),delta={};let left=m;
  if(tot>0){const take=Math.min(m,tot);pos.forEach(o=>{delta[o.id]=-r3(take*c.raw[o.id]/tot)});left=r3(m-take)}
  if(left>0.0005){const i=impObj();if(i)delta[i.id]=r3((delta[i.id]||0)-left)}
  return fixSum(delta,-r3(m));
}
function saveDepot(){
  const m=r3(num($('#depM').value));if(!(m>0)){toast('Entre un montant valide');return}
  const c=compute(S),pourDu=r3(Math.min(m,c.aMettre)),extra=r3(m-pourDu);
  const t={id:uid(),ts:Date.now(),date:todayISO(),type:'depot',montant:m,pourDu,hors:false,note:extra>0?'dont '+fmt(extra)+' en plus (pris sur les objets)':''};
  if(extra>0)t.delta=takeFrom(extra);
  S.tx.push(t);save();toast('🐷 Boîte d\'épargne mise à jour ✔');render();
}

/* ---------- premier lancement ---------- */
function setupHTML(){
  return `<div class="card"><h2 style="margin:0 0 6px;text-transform:none;letter-spacing:0;color:var(--tx);font-size:18px">👋 Bienvenue dans Pocket Money</h2>
  <div class="mut">Indique ta situation de départ. Tout reste sur ce téléphone.</div>
  <label>Argent que tu as en poche maintenant (dt)</label><input id="suM" class="amount" inputmode="decimal" placeholder="0,000">
  <label>Déjà dans ta boîte d'épargne (dt)</label><input id="suB" inputmode="decimal" value="0">
  <label>% de chaque revenu à mettre dans la boîte d'épargne</label><input id="suI" inputmode="decimal" value="10">
  <div class="mut" style="margin-top:8px">Des objets de départ (transport, repas…) sont créés ; tu pourras les modifier dans Réglages.</div>
  <button class="btn" onclick="startApp()">Commencer</button></div>
  <div class="card"><b>…ou restaurer une sauvegarde</b><input type="file" accept=".json,application/json,text/plain" onchange="importFile(this)" style="margin-top:8px">
  <textarea id="imp" placeholder='{"v":1,...}' style="margin-top:8px"></textarea><button class="btn sm sec" onclick="importBk()">Restaurer</button></div>`;
}
function startApp(){
  const m=num($('#suM').value),b=num($('#suB').value),i=num($('#suI').value);
  if(!(m>=0)){toast('Entre le montant en poche');return}
  S=initial(m,b>0?b:0,i>=0&&i<=100?i:10);save();toast('C\'est parti ✔');go('home');
}

/* ---------- code PIN ---------- */
let pinBuf='';
async function hashPin(pin,salt){
  const d=new TextEncoder().encode(salt+':'+pin);
  try{const h=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let x=0;for(const c of salt+':'+pin)x=(x*31+c.charCodeAt(0))|0;return 'f'+x}
}
function showLock(){
  pinBuf='';let el=$('#lock');
  if(!el){el=document.createElement('div');el.id='lock';document.body.appendChild(el)}
  el.innerHTML=`<div class="lockin"><img src="icon-192.png" width="64" height="64" style="border-radius:16px"><h1 style="font-size:20px;margin:12px 0 4px">Pocket Money</h1>
  <div class="mut">Entre ton code PIN</div><div id="dots" class="dots"></div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
  <button class="lnk" id="forgot">Code oublié ?</button><div id="forgotBox" hidden class="mut" style="max-width:280px;text-align:center">Le code ne peut pas être récupéré. Tu peux tout effacer puis restaurer une sauvegarde.<button class="btn danger sm" id="wipe">Tout effacer</button></div></div>`;
  el.hidden=false;drawDots();
  el.querySelector('.pad').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
    if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(k==='OK')checkPin();else if(pinBuf.length<6){pinBuf+=k;if(pinBuf.length===(S.pin.len||4))checkPin()}
    drawDots()};

}

/* ---------- ajustements proposés par Claude (lien ou code) ---------- */
let PENDING=null;
function parseMaj(str){
  str=String(str||'').trim();
  const m=str.match(/maj=([^&\s#]+)/);if(m)str=decodeURIComponent(m[1]);
  str=str.replace(/^PM:/i,'');
  const pct={};let inv=null,ok=false;
  str.split(/[;,]/).forEach(p=>{const [k,v]=p.split(/[:=]/).map(x=>x&&x.trim());const n=num(v);if(!k||!isFinite(n)||n<0)return;
    if(k==='invest'||k==='inv'){inv=n;ok=true}else if(S.objets.some(o=>o.id===k)){pct[k]=n;ok=true}});
  return ok?{pct,inv}:null;
}
function pendingHTML(){
  if(!PENDING)return '';
  const rows=S.objets.filter(o=>o.id in PENDING.pct).map(o=>`<tr><td>${esc(o.nom)}</td><td class="mut">${+o.pct}%</td><td>→ <b>${PENDING.pct[o.id]}%</b></td></tr>`).join('');
  return `<div class="card alert info"><b>🤖 Ajustement proposé par Claude</b>
  <table class="sugg">${rows}${PENDING.inv!=null?`<tr><td>Investissement</td><td class="mut">${S.investPct}%</td><td>→ <b>${PENDING.inv}%</b></td></tr>`:''}</table>
  <label class="chk"><input type="checkbox" id="pReeq" checked> Appliquer aussi à l'argent disponible maintenant</label>
  <div class="o3"><button class="btn sm" onclick="applyPending()">Appliquer</button><button class="btn sm sec" onclick="PENDING=null;render()">Refuser</button></div></div>`;
}
function applyPending(){
  if(!PENDING)return;
  for(const id in PENDING.pct){const o=objById(id);if(o)o.pct=PENDING.pct[id]}
  if(PENDING.inv!=null)S.investPct=PENDING.inv;
  if($('#pReeq')&&$('#pReeq').checked)rebalance("Rééquilibrage (ajustement Claude)");
  S.lastAdjust=Date.now();PENDING=null;save();toast('Ajustement appliqué ✔');render();
}
function useCode(){const p=parseMaj($('#majCode').value);if(!p){toast('Code non reconnu');return}PENDING=p;go('home')}

function saveTx(){
  const m=r3(num($('#fM').value));
  if(!(m>0)){toast('Entre un montant valide');return}
  const date=$('#fDate').value||todayISO(),note=$('#fNote').value.trim();
  const t={id:uid(),ts:tsFor(date),date,type:F.type,montant:m,hors:F.hors,note};
  let msg='Enregistré ✔';
  if(F.type==='epargne'){
    t.type='epargne';t.hors=false;t.fromSolde=!!F.epSolde;if(F.epSolde)t.delta=takeFrom(m);
    msg='🐷 Ajouté à la boîte d\'épargne ✔';
  }else if(F.type==='dette'){
    const q=$('#fQui').value.trim();if(!q){toast('Indique la personne');return}
    t.qui=q;t.hors=false;
    if(F.dsub==='remb'){t.type='rembDette';t.delta=takeFrom(m);msg='Remboursement enregistré ✔'}
    else{t.type='emprunt';t.alloc=splitPct(S,m);msg='Dette enregistrée ✔'}
  }else if(F.hors){
    const n=$('#fHorsNom').value.trim();if(!n){toast("Indique l'objet hors budget");return}
    t.objNom=n;msg='Hors budget enregistré ✔';
  }else if(F.type==='revenu'){
    const c0=compute(S),remb=!$('#bRemb').hidden&&$('#fRembOn').checked?num($('#fRembM').value)||0:0;
    t.alloc=allocate(S,m,c0.dette,remb,c0.dettesList);
    msg=Object.keys(t.alloc.dettes).length?'Revenu réparti, dette remboursée ✔':'Revenu réparti ✔';
  }else{
    let id=$('#fObj').value;
    if(id==='__new'){
      const n=$('#fNewNom').value.trim();if(!n){toast('Donne un nom au nouvel objet');return}
      const ex=S.objets.find(o=>o.nom.toLowerCase()===n.toLowerCase());
      if(ex)id=ex.id;else{id=uid();S.objets.push({id,nom:n,pct:0,prio:+$('#fNewPrio').value})}
    }
    t.obj=id;t.objNom=objById(id).nom;
    if($('#fUrg').checked){t.urgence=true;msg="Pris dans l'investissement — remboursement automatique"}
  }
  S.tx.push(t);save();
  $('#fM').value='';$('#fNote').value='';
  toast(msg);go('home');
}

let HF={f:'all',o:''};

  let list=[...(TR?(S.trash||[]):S.tx)].sort((a,b)=>TR?b.deletedAt-a.deletedAt:b.ts-a.ts);
  if(HF.f==='in')list=list.filter(t=>!t.hors);
  if(HF.f==='out')list=list.filter(t=>t.hors);
  if(HF.f==='urg')list=list.filter(t=>t.urgence);
  if(HF.f==='det')list=list.filter(t=>t.type==='emprunt'||t.type==='rembDette'||(t.alloc&&t.alloc.dettes&&Object.keys(t.alloc.dettes).length));
  if(HF.f==='box')list=list.filter(t=>t.type==='depot'||t.type==='epargne');
  if(HF.o)list=list.filter(t=>(t.obj===HF.o)||(t.hors&&t.objNom===HF.o));
  const names=[...S.objets.map(o=>({v:o.id,n:o.nom})),...[...new Set(S.tx.filter(t=>t.hors&&t.objNom).map(t=>t.objNom))].map(n=>({v:n,n:n+' (hors budget)'}))];
  let tot=0;list.forEach(t=>{if(t.type==='revenu'||t.type==='emprunt')tot+=t.montant;else if(t.type==='depense'||t.type==='rembDette')tot-=t.montant});
  let h=`<div class="chips">${[['all','Tout'],['in','Budget'],['out','Hors budget'],['urg','Urgences'],['det','Dettes'],['box','Épargne'],['trash','🗑 Corbeille'+((S.trash||[]).length?' ('+S.trash.length+')':'')]].map(([k,l])=>`<button class="${HF.f===k?'on':''}" onclick="HF.f='${k}';render()">${l}</button>`).join('')}</div>
  <select onchange="HF.o=this.value;render()"><option value="">Tous les objets</option>${names.map(x=>`<option value="${esc(x.v)}" ${HF.o===x.v?'selected':''}>${esc(x.n)}</option>`).join('')}</select>
  ${TR?`<div class="card alert info"><b>🗑 Corbeille</b><div class="mut">Les opérations supprimées restent ici 30 jours. ↩️ les remet dans tes calculs, ✖ les efface pour de bon.</div>${list.length?`<button class="btn sm danger" onclick="emptyTrash(this)">Vider la corbeille</button>`:''}</div>`:''}
  <div class="card"><div class="row mut"><span>${list.length} opérations</span>${TR?'':`<span>Solde du filtre : <b style="color:var(--tx)">${fmt(tot)}</b></span>`}</div>`;
  if(!list.length)h+='<div class="mut" style="padding:16px 0;text-align:center">Rien à afficher</div>';
  list.forEach(t=>{
    let label,amt;
    if(t.type==='revenu'){label=t.hors?'Revenu – '+esc(t.objNom):'Revenu';amt=`<span class="pos">+${fmt(t.montant)}</span>`}
    else if(t.type==='depense'){const o=objById(t.obj);label=esc(o?o.nom:(t.objNom||'(objet supprimé)'));amt=`<span class="neg">−${fmt(t.montant)}</span>`}
    else if(t.type==='depot'){label='🐷 Mis dans la boîte d\'épargne';amt=`<span class="mut">${fmt(t.montant)}</span>`}
    else if(t.type==='epargne'){label='🐷 Épargne ajoutée'+(t.fromSolde?' (depuis le solde)':' (argent à part)');amt=`<span class="mut">${fmt(t.montant)}</span>`}
    else if(t.type==='emprunt'){label='💳 Dette reçue – '+esc(t.qui);amt=`<span class="pos">+${fmt(t.montant)}</span>`}
    else if(t.type==='rembDette'){label='💳 Remboursé – '+esc(t.qui);amt=`<span class="neg">−${fmt(t.montant)}</span>`}
    else{label='⚖️ Rééquilibrage';amt='<span class="mut">—</span>'}
    let nt=t.note||'';if(t.type==='revenu'&&t.alloc&&t.alloc.dettes&&Object.keys(t.alloc.dettes).length)nt=(nt?nt+' · ':'')+'dont remboursé : '+Object.entries(t.alloc.dettes).map(([q,v])=>q+' '+fmt(v)).join(', ');
    const badges=(t.hors?'<span class="badge hb">Hors budget</span> ':'')+(t.urgence?'<span class="badge urg">Urgence</span>':'');
    h+=`<div class="tx"><div class="l"><b>${label}</b><span class="mut">${fdate(t.date)}${nt?' · '+esc(nt):''}${TR?' · supprimé le '+new Date(t.deletedAt).toLocaleDateString('fr-FR'):''}</span> ${badges}</div>${amt}${TR?`<button class="del" title="Restaurer" onclick="restoreTx('${t.id}')">↩️</button><button class="del" title="Supprimer définitivement" onclick="purgeTx(this,'${t.id}')">✖</button>`:`<button class="del" onclick="delTx(this,'${t.id}')">🗑</button>`}</div>`;
  });
  return h+'</div>';
}
function delTx(btn,id){
  if(!btn.classList.contains('confirm')){btn.classList.add('confirm');btn.textContent='Supprimer ?';setTimeout(()=>{if(btn.isConnected){btn.classList.remove('confirm');btn.textContent='🗑'}},3000);return}
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  S.tx=S.tx.filter(x=>x.id!==id);S.trash=S.trash||[];S.trash.push({...t,deletedAt:Date.now()});
  save();toast('Mis dans la corbeille 🗑');render();
}
function restoreTx(id){
  const t=(S.trash||[]).find(x=>x.id===id);if(!t)return;
  S.trash=S.trash.filter(x=>x.id!==id);const r={...t};delete r.deletedAt;S.tx.push(r);
  if(r.obj&&!objById(r.obj))r.obj=(impObj()||{}).id;
  save();toast('Opération restaurée ↩️');render();
}
function purgeTx(btn,id){
  if(!btn.classList.contains('confirm')){btn.classList.add('confirm');btn.textContent='Effacer ?';setTimeout(()=>{if(btn.isConnected){btn.classList.remove('confirm');btn.textContent='✖'}},3000);return}
  S.trash=(S.trash||[]).filter(x=>x.id!==id);save();toast('Effacé définitivement');render();
}
function emptyTrash(btn){
  if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Appuie encore pour tout effacer';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent='Vider la corbeille'}},4000);return}
  S.trash=[];save();toast('Corbeille vidée');render();
}
function purgeOld(){if(!S.trash||!S.trash.length)return;const n=S.trash.length;S.trash=S.trash.filter(t=>Date.now()-t.deletedAt<30*DAY);if(S.trash.length!==n)save()}

/* Analyse */
function statsHTML(){
  const c=compute(S);
  const since=S.lastAdjust,deps=S.tx.filter(t=>t.type==='depense'&&!t.hors);
  const tot=deps.reduce((a,t)=>a+t.montant,0),sum=sumPct(S);
  const days=Math.max(1,(Date.now()-Math.min(S.created,...S.tx.map(t=>t.ts)))/DAY);
  let h=`<div class="card"><b>Consommation réelle vs prévue</b><div class="mut">Toutes les dépenses dans le budget (${fmt(tot)} sur ${Math.round(days)} jour(s))</div><table style="margin-top:8px">
  <tr class="mut"><td>Objet</td><td>Prévu</td><td>Réel</td></tr>`;
  S.objets.forEach(o=>{const d=c.dep[o.id]+c.depUrg[o.id],real=tot>0?d/tot*sum:0;h+=`<tr><td>${esc(o.nom)}</td><td>${+o.pct}%</td><td><b>${tot>0?real.toFixed(1)+'%':'—'}</b></td></tr>`});
  h+=`</table><div class="mut" style="margin-top:8px">Le « réel » est ramené sur les ${sum}% des objets (l'investissement reste à ${S.investPct}%).</div></div>`;
  // hors budget
  const hb={};S.tx.filter(t=>t.hors).forEach(t=>{const k=t.objNom||'?';hb[k]=hb[k]||{dep:0,rev:0,n:0};hb[k][t.type==='revenu'?'rev':'dep']+=t.montant;hb[k].n++});
  h+=`<div class="card"><b>Hors budget (pour ton futur programme)</b>`;
  const ks=Object.keys(hb);
  if(!ks.length)h+='<div class="mut">Aucune opération hors budget pour l\'instant.</div>';
  else{h+='<table style="margin-top:8px"><tr class="mut"><td>Objet</td><td>Dépensé</td><td>Reçu</td></tr>'+ks.sort((a,b)=>hb[b].dep-hb[a].dep).map(k=>`<tr><td>${esc(k)}</td><td>${fmt(hb[k].dep)}</td><td>${fmt(hb[k].rev)}</td></tr>`).join('')+'</table>'}
  h+='</div>';
  h+=`<div class="card"><b>🤖 Export pour Claude</b><div class="mut">Copie ce texte et colle-le dans la conversation pour que j'analyse ta consommation et ajuste les pourcentages.</div>
  <button class="btn" onclick="shareExport()">📤 Partager vers Claude</button>
  <div class="o3"><button class="btn sm sec" onclick="copyText(exportText())">Copier</button><button class="btn sm sec" onclick="dl('pocket-money-export-'+todayISO()+'.txt',exportText(),'text/plain')">Fichier .txt</button></div>
  <details style="margin-top:10px"><summary class="mut">Voir le texte</summary><textarea id="exp" readonly>${esc(exportText())}</textarea></details></div>`;
  return h;
}
function exportText(){
  const c=compute(S),L=[];
  L.push('EXPORT POCKET MONEY — '+new Date().toLocaleString('fr-FR'));
  L.push(`Paramètres : investissement ${S.investPct}% · remboursement urgences ${S.refundPct}% · économies de départ ${fmt(S.investInit)}`);
  L.push(`Solde : ${fmt(c.dispo+c.aMettre)} · Pour les objets : ${fmt(c.dispo)} · Boîte d'épargne : ${fmt(c.boite)} · À mettre dans la boîte d'épargne : ${fmt(c.aMettre)} · Dette urgences : ${fmt(c.dette)}`);
  L.push('Dettes de dépannage : '+(c.dettesList.length?c.dettesList.map(([q,v])=>q+' '+fmt(v)).join(', '):'aucune'));
  L.push('','OBJETS ([id] nom | priorité | % | alloué | dépensé | reste | échéance/objectif)');
  S.objets.forEach(o=>L.push(`- [${o.id}] ${o.nom} | P${o.prio} | ${o.pct}% | ${fmt(c.alloue[o.id])} | ${fmt(c.dep[o.id])} | ${fmt(c.eff[o.id])}${o.echeance?' | éch. '+o.echeance:''}${+o.cible>0?' | obj. '+fmt(o.cible):''}`));
  L.push('','HISTORIQUE (date | type | objet | montant | budget | note)');
  [...S.tx].sort((a,b)=>a.ts-b.ts).forEach(t=>{
    if(t.type==='reeq'){L.push(`${t.date} | rééquilibrage | — | — | budget | ${t.note||''}`);return}
    if(t.type==='epargne'){L.push(`${t.date} | épargne ajoutée | ${t.fromSolde?'depuis le solde':'argent à part'} | ${r3(t.montant)} | budget | ${t.note||''}`);return}
    if(t.type==='depot'){L.push(`${t.date} | dépôt boîte | — | ${r3(t.montant)} | budget | ${t.note||''}`);return}
    if(t.type==='emprunt'||t.type==='rembDette'){L.push(`${t.date} | ${t.type==='emprunt'?'dette reçue':'dette remboursée'} | ${t.qui} | ${t.type==='emprunt'?'+':'-'}${r3(t.montant)} | budget | ${t.note||''}`);return}
    if(t.type==='revenu'&&t.alloc&&t.alloc.dettes&&Object.keys(t.alloc.dettes).length){L.push(`${t.date} | revenu | — | +${r3(t.montant)} | budget | ${t.note||''} (dont dettes remboursées : ${Object.entries(t.alloc.dettes).map(([q,v])=>q+' '+r3(v)).join(', ')})`);return}
    const o=t.obj?objById(t.obj):null;
    L.push(`${t.date} | ${t.type}${t.urgence?' (urgence)':''} | ${o?o.nom:(t.objNom||'—')} | ${t.type==='revenu'?'+':'-'}${r3(t.montant)} | ${t.hors?'HORS':'budget'} | ${t.note||''}`);
  });
  return L.join('\n');
}

/* Réglages */
let resetArm=false;
function setHTML(){
  const sum=sumPct(S),tot=sum+(+S.investPct);
  let h=`<div class="card"><b>🔒 Code PIN</b>${S.pin?`<div class="mut">Activé. L'appli le demande à l'ouverture et après 1 min en arrière-plan.</div>
    <label>Nouveau code (4 à 6 chiffres)</label><input id="pin1" type="password" inputmode="numeric" maxlength="6"><label>Confirmer</label><input id="pin2" type="password" inputmode="numeric" maxlength="6">
    <div class="o3"><button class="btn sm" onclick="setPin()">Changer</button><button class="btn sm sec" onclick="removePin()">Supprimer</button></div>`
    :`<div class="mut">Protège l'appli si quelqu'un prend ton téléphone.</div>
    <label>Code (4 à 6 chiffres)</label><input id="pin1" type="password" inputmode="numeric" maxlength="6"><label>Confirmer</label><input id="pin2" type="password" inputmode="numeric" maxlength="6">
    <button class="btn sm" onclick="setPin()">Activer le code PIN</button>`}</div>
  <div class="card"><b>🤖 Code d'ajustement de Claude</b><div class="mut">Colle ici le code que Claude t'a donné (ou ouvre directement son lien).</div><input id="majCode" placeholder="PM:transport=44;repas=24;…"><button class="btn sm" onclick="useCode()">Voir l'ajustement</button></div>
  <div class="card"><b>Investissement</b><div class="o3"><div><label>% de chaque revenu</label><input id="sInv" inputmode="decimal" value="${S.investPct}"></div><div><label>% remboursement urgence</label><input id="sRef" inputmode="decimal" value="${S.refundPct}"></div></div>
  <label>Boîte d'épargne de départ (dt)</label><input id="sInit" inputmode="decimal" value="${S.investInit}"></div>
  <h2>Objets</h2><div class="mut" style="margin:0 4px">Total objets ${sum}% + investissement ${S.investPct}% = <b style="color:${Math.abs(tot-100)<0.01?'var(--ok)':'var(--warn)'}">${tot}%</b>${Math.abs(tot-100)<0.01?' ✔':' (idéalement 100 %)'}</div>`;
  S.objets.forEach((o,i)=>{
    const used=S.tx.some(t=>t.obj===o.id);
    h+=`<div class="card" data-i="${i}"><input class="oNom" value="${esc(o.nom)}" style="font-weight:700">
    <div class="o3"><div><label>%</label><input class="oPct" inputmode="decimal" value="${o.pct}"></div><div><label>Priorité</label><select class="oPrio">${[1,2,3].map(p=>`<option ${o.prio==p?'selected':''}>${p}</option>`).join('')}</select></div></div>
    <div class="o3"><div><label>Échéance</label><input type="date" class="oEch" value="${o.echeance||''}"></div><div><label>Objectif (dt)</label><input class="oCib" inputmode="decimal" value="${o.cible||''}" placeholder="facultatif"></div></div>
    ${o.imprevu?'<div class="mut" style="margin-top:6px">Objet « Imprévus » : il couvre en premier les dépassements et les nouveaux objets.</div>':used?'<div class="mut" style="margin-top:6px">Utilisé dans l\'historique (mets 0 % pour ne plus l\'alimenter).</div>':`<button class="btn sm sec" onclick="delObj(${i})">Supprimer cet objet</button>`}</div>`;
  });
  h+=`<button class="btn sec" onclick="addObj()">+ Ajouter un objet</button>
  <label class="chk"><input type="checkbox" id="sReeq"> Appliquer les nouveaux % à l'argent disponible maintenant (sinon : seulement aux prochains revenus)</label>
  <button class="btn" onclick="saveSet()">Enregistrer les réglages</button>
  <h2>Sauvegarde</h2><div class="card"><div class="mut">Copie ce code et garde-le (notes, WhatsApp à toi-même…). Il permet de tout restaurer.</div>
  <div class="o3"><button class="btn sm" onclick="backup('file')">💾 Fichier</button><button class="btn sm" onclick="backup('copy')">Copier le code</button></div>
  <label>Restaurer depuis un fichier</label><input type="file" accept=".json,application/json,text/plain" onchange="importFile(this)">
  <label>…ou colle un code de sauvegarde</label><textarea id="imp" placeholder='{"v":1,...}'></textarea><button class="btn sm sec" onclick="importBk()">Restaurer</button></div>
  <h2>Zone sensible</h2><div class="card"><button class="btn danger sm" onclick="resetAll(this)">${resetArm?'Appuie encore pour tout effacer':'Tout réinitialiser'}</button></div>`;
  return h;
}
function readSetForm(){
  document.querySelectorAll('[data-i]').forEach(card=>{
    const o=S.objets[+card.dataset.i];if(!o)return;
    o.nom=card.querySelector('.oNom').value.trim()||o.nom;
    const p=num(card.querySelector('.oPct').value);o.pct=isFinite(p)&&p>=0?p:0;
    o.prio=+card.querySelector('.oPrio').value;
    o.echeance=card.querySelector('.oEch').value||'';
    const cb=num(card.querySelector('.oCib').value);o.cible=cb>0?cb:'';
  });
  const inv=num($('#sInv').value),ref=num($('#sRef').value),ini=num($('#sInit').value);
  if(inv>=0&&inv<=100)S.investPct=inv;if(ref>=0&&ref<=100)S.refundPct=ref;if(ini>=0)S.investInit=ini;
}
function saveSet(){readSetForm();if($('#sReeq').checked)rebalance('Rééquilibrage (réglages)');S.lastAdjust=Date.now();save();toast('Réglages enregistrés');render()}
function addObj(){readSetForm();S.objets.push({id:uid(),nom:'Nouvel objet',pct:0,prio:3});save();render();window.scrollTo(0,document.body.scrollHeight)}
function delObj(i){readSetForm();S.objets.splice(i,1);save();render()}
function backup(how){S.lastBackup=Date.now();save();const j=JSON.stringify(S);if(how==='file')dl('pocket-money-sauvegarde-'+todayISO()+'.json',j,'application/json');else copyText(j)}
function dl(name,txt,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Fichier enregistré dans Téléchargements')}catch(e){toast('Téléchargement impossible ici')}}
async function shareExport(){const t=exportText();if(navigator.share){try{await navigator.share({title:'Export Pocket Money',text:t});return}catch(e){if(e&&e.name==='AbortError')return}}copyText(t)}
function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;f.text().then(txt=>{$('#imp').value=txt;importBk()})}
function importBk(){
  try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.objets)||!Array.isArray(d.tx))throw 0;S=d;save();toast('Données restaurées ✔');go('home')}
  catch(e){toast('Sauvegarde invalide')}
}
function resetAll(){if(!resetArm){resetArm=true;render();setTimeout(()=>{resetArm=false;if(tab==='set')render()},4000);return}resetArm=false;try{localStorage.removeItem(KEY)}catch(e){}S=null;tab='home';toast('Réinitialisé');render()}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
S=load();
if(S&&S.pin)showLock();
try{if(S){const q=new URLSearchParams(location.search).get('maj');if(q){PENDING=parseMaj('maj='+encodeURIComponent(q));history.replaceState(null,'',location.pathname)}}}catch(e){}
render();
</script>
</body>
