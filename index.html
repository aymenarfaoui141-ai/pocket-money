<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Pocket Money</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Pocket Money">
<meta name="application-name" content="Pocket Money">
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#14201d;--mut:#62706c;--ac:#0f766e;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--line:#e2e8e6;--soft:#eef3f1}
@media (prefers-color-scheme:dark){:root{--bg:#0c1311;--card:#151f1c;--tx:#e8efed;--mut:#93a39f;--line:#24312d;--soft:#1b2724;--ac:#14b8a6}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px;-webkit-tap-highlight-color:transparent}
header{padding:16px 16px 0;max-width:560px;margin:0 auto}
header h1{font-size:20px;margin:0}
main{padding:4px 12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;border:0}
.hero .mut{color:#cdeae5}
.big{font-size:34px;font-weight:750;letter-spacing:-.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.mini b{display:block;font-size:16px}
.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;border-radius:6px}
h2{font-size:15px;margin:18px 4px 4px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button.on{color:var(--ac);font-weight:700}
nav .ico{font-size:21px;line-height:1.2}
nav .plus .ico{background:var(--ac);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:24px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font:inherit;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
textarea{font-family:ui-monospace,monospace;font-size:12px;min-height:120px}
.amount{font-size:28px;font-weight:700;text-align:center}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--tx)}
.chk input{width:20px;height:20px;margin:0;flex:none}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:16px;margin-top:14px;text-align:center}
.btn.sec{background:var(--soft);color:var(--tx)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:9px;font-size:14px;margin-top:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap;font-weight:600}
.p1{background:#fee2e2;color:#991b1b}.p2{background:#fef3c7;color:#92400e}.p3{background:#dbeafe;color:#1e40af}
.hb{background:#ede9fe;color:#5b21b6}.urg{background:#fee2e2;color:#991b1b}
.alert{border-left:4px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)}
.alert.info{border-left-color:var(--ac)}
.mut{color:var(--mut);font-size:13px}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .l{flex:1;min-width:0}
.tx .l b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{background:none;border:0;color:var(--mut);font-size:16px;padding:6px}
.del.confirm{color:#fff;background:var(--bad);border-radius:8px;font-size:12px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sugg td{padding:4px 2px}
table{width:100%;border-collapse:collapse;font-size:14px}
.prev div{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.o3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;z-index:9;font-size:14px}
#toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="row"><h1 style="display:flex;align-items:center;gap:8px"><img src="icon-192.png" alt="" width="30" height="30" style="border-radius:8px">Pocket Money</h1><span class="mut" id="today"></span></div></header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="home" class="on"><span class="ico">🏠</span>Accueil</button>
  <button data-tab="hist"><span class="ico">🧾</span>Historique</button>
  <button data-tab="add" class="plus"><span class="ico">+</span>Déclarer</button>
  <button data-tab="stats"><span class="ico">📊</span>Analyse</button>
  <button data-tab="set"><span class="ico">⚙️</span>Réglages</button>
</nav>
<div id="toast"></div>
<script>
"use strict";
const KEY='monBudget_v1', DAY=86400000;
let storageOK=true;
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r3=n=>Math.round(n*1000)/1000;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(r3(n)).toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3})+' dt';
const num=v=>{const x=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(x)?x:NaN};
function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function tsFor(date){const n=new Date();const t=new Date(date+'T'+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0')).getTime();return isFinite(t)?t:Date.now()}
const fdate=d=>{try{return new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}catch(e){return d}};

/* ---------- données ---------- */
function initial(){
  const now=Date.now();
  const s={v:1,investPct:10,refundPct:5,investInit:10,created:now,lastAdjust:now,lastBackup:0,tx:[],objets:[
    {id:'transport',nom:'Transport',pct:42,prio:1},
    {id:'repas',nom:'Repas et café hors maison',pct:25,prio:1},
    {id:'coiffeur',nom:'Coiffeur',pct:8,prio:2},
    {id:'imprevus',nom:'Imprévus et objets ponctuels',pct:5,prio:2,imprevu:true},
    {id:'sorties',nom:'Sorties et loisirs',pct:7,prio:3},
    {id:'dons',nom:'Dons',pct:3,prio:3}
  ]};
  s.tx.push({id:uid(),ts:now,date:todayISO(),type:'revenu',montant:119.25,hors:false,note:'Solde de départ',alloc:allocate(s,119.25,0)});
  return s;
}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){storageOK=false;return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
let S;

const sumPct=s=>s.objets.reduce((a,o)=>a+(+o.pct||0),0);
const objById=id=>S.objets.find(o=>o.id===id);
const impObj=()=>S.objets.find(o=>o.imprevu)||S.objets[0];

function allocate(s,m,dette){
  const invest=r3(m*s.investPct/100);
  const refund=r3(Math.min(dette,m*s.refundPct/100));
  const net=m-invest-refund, sum=sumPct(s), obj={};
  if(sum>0){s.objets.forEach(o=>{if(+o.pct>0)obj[o.id]=r3(net*o.pct/sum)})}
  else{const i=s.objets.find(o=>o.imprevu)||s.objets[0];if(i)obj[i.id]=r3(net)}
  const tot=invest+refund+Object.values(obj).reduce((a,b)=>a+b,0), diff=r3(m-tot);
  if(diff!==0){const k=Object.keys(obj).sort((a,b)=>obj[b]-obj[a])[0];if(k)obj[k]=r3(obj[k]+diff)}
  return {invest,refund,obj};
}

function compute(s){
  const raw={},alloue={},dep={},depUrg={};
  s.objets.forEach(o=>{raw[o.id]=0;alloue[o.id]=0;dep[o.id]=0;depUrg[o.id]=0});
  let invest=+s.investInit||0,dette=0,urgTot=0;
  const fallback=(s.objets.find(o=>o.imprevu)||s.objets[0]||{}).id;
  for(const t of [...s.tx].sort((a,b)=>a.ts-b.ts)){
    if(t.hors)continue;
    if(t.type==='revenu'){
      const a=t.alloc||{invest:0,refund:0,obj:{}};
      for(const k in a.obj){const id=(k in raw)?k:fallback;if(id){raw[id]+=a.obj[k];alloue[id]+=a.obj[k]}}
      invest+=a.invest+a.refund;dette=Math.max(0,dette-a.refund);
    }else if(t.type==='depense'){
      if(t.urgence){invest-=t.montant;dette+=t.montant;urgTot+=t.montant;if(t.obj in depUrg)depUrg[t.obj]+=t.montant}
      else{const id=(t.obj in raw)?t.obj:fallback;if(id){raw[id]-=t.montant;dep[id]+=t.montant}}
    }else if(t.type==='reeq'){for(const k in t.delta)if(k in raw){raw[k]+=t.delta[k];alloue[k]+=t.delta[k]}}
  }
  // couverture des dépassements : Imprévus d'abord, puis priorité 3, puis priorité 2
  const eff={...raw},transfers=[];
  const deficits=s.objets.filter(o=>eff[o.id]<-0.0005).sort((a,b)=>a.prio-b.prio);
  for(const d of deficits){
    let need=-eff[d.id];
    const donors=s.objets.filter(o=>o.id!==d.id&&(o.imprevu||o.prio>=2)&&eff[o.id]>0)
      .sort((a,b)=>(b.imprevu?1:0)-(a.imprevu?1:0)||b.prio-a.prio||eff[b.id]-eff[a.id]);
    for(const o of donors){if(need<=0.0005)break;const take=Math.min(need,eff[o.id]);eff[o.id]-=take;eff[d.id]+=take;need-=take;transfers.push({from:o.id,to:d.id,m:take})}
  }
  const dispo=Object.values(raw).reduce((a,b)=>a+b,0);
  const deficit=-Object.values(eff).filter(v=>v<0).reduce((a,b)=>a+b,0);
  return {raw,eff,alloue,dep,depUrg,invest,dette,dispo,deficit,transfers,urgTot};
}

function perDay(){
  const deps=S.tx.filter(t=>t.type==='depense'&&!t.hors&&!t.urgence);
  if(!deps.length)return {v:9,est:true};
  const first=Math.min(...deps.map(t=>t.ts)),days=(Date.now()-first)/DAY;
  if(days<3)return {v:9,est:true};
  return {v:deps.reduce((a,t)=>a+t.montant,0)/days,est:false};
}

function suggestion(){
  if(Date.now()-S.lastAdjust<7*DAY)return null;
  const deps=S.tx.filter(t=>t.type==='depense'&&!t.hors&&t.ts>=S.lastAdjust);
  if(deps.length<5)return null;
  const tot=deps.reduce((a,t)=>a+t.montant,0);if(tot<=0)return null;
  const sum=sumPct(S),by={};deps.forEach(t=>by[t.obj]=(by[t.obj]||0)+t.montant);
  const sug=S.objets.map(o=>({id:o.id,nom:o.nom,cur:+o.pct,real:(by[o.id]||0)/tot*sum,sug:Math.round((+o.pct+(by[o.id]||0)/tot*sum)/2)}));
  const d=Math.round(sum-sug.reduce((a,x)=>a+x.sug,0));
  if(d!==0){const top=[...sug].sort((a,b)=>b.sug-a.sug)[0];top.sug+=d}
  if(sug.every(x=>Math.abs(x.sug-x.cur)<1))return null;
  return sug;
}

function rebalance(note){
  const c=compute(S);if(c.dispo<=0)return false;
  const sum=sumPct(S);if(sum<=0)return false;
  const delta={};S.objets.forEach(o=>{delta[o.id]=r3(c.dispo*(+o.pct||0)/sum-c.raw[o.id])});
  S.tx.push({id:uid(),ts:Date.now(),date:todayISO(),type:'reeq',delta,hors:false,note:note||'Rééquilibrage du disponible'});
  return true;
}

/* ---------- interface ---------- */
let tab='home';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();window.scrollTo(0,0)}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.tab)});
const prioBadge=p=>`<span class="badge p${p}">P${p}</span>`;
function barColor(r){return r>0.5?'var(--ok)':r>0.2?'var(--warn)':'var(--bad)'}
async function copyText(txt,ta){
  try{await navigator.clipboard.writeText(txt);toast('Copié ✔ — colle-le dans Claude');return true}
  catch(e){if(ta){ta.focus();ta.select()}toast('Sélectionné : appuie longuement → Copier');return false}
}

function render(){
  $('#today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const v=$('#view');
  if(tab==='home')v.innerHTML=homeHTML();
  else if(tab==='add'){v.innerHTML=addHTML();bindAdd()}
  else if(tab==='hist')v.innerHTML=histHTML();
  else if(tab==='stats')v.innerHTML=statsHTML();
  else if(tab==='set')v.innerHTML=setHTML();
}

/* Accueil */
function homeHTML(){
  const c=compute(S),pd=perDay(),jours=pd.v>0?c.dispo/pd.v:Infinity;
  let h='';
  if(!storageOK)h+=`<div class="card alert bad"><b>⚠️ Stockage indisponible ici.</b><div class="mut">Ouvre ce lien dans Chrome sur ton téléphone pour que tes données soient gardées.</div></div>`;
  h+=`<div class="card hero"><div class="mut">Disponible (hors investissement)</div><div class="big">${fmt(c.dispo)}</div>
  <div class="grid2"><div class="mini"><span class="mut">Investissement</span><b>${fmt(c.invest)}</b></div>
  <div class="mini"><span class="mut">Tu tiens ≈</span><b>${isFinite(jours)?Math.max(0,Math.floor(jours))+' jours':'—'}</b><span class="mut">${pd.est?'estimation':fmt(pd.v)+'/jour'}</span></div></div>
  ${c.dette>0.0005?`<div class="mini" style="margin-top:8px"><span class="mut">Dette d'urgence à rembourser</span><b>${fmt(c.dette)}</b><span class="mut">+${S.investPct+S.refundPct>0?S.refundPct:0}% prélevés à chaque revenu</span></div>`:''}</div>`;
  const sug=suggestion();
  if(sug)h+=`<div class="card alert info"><b>📈 Suggestion après 7 jours</b><div class="mut">D'après ta vraie consommation :</div>
    <table class="sugg">${sug.map(x=>`<tr><td>${esc(x.nom)}</td><td class="mut">${x.cur}%</td><td>→ <b>${x.sug}%</b></td></tr>`).join('')}</table>
    <label class="chk"><input type="checkbox" id="sugReeq" checked> Appliquer aussi à l'argent disponible maintenant</label>
    <div class="o3"><button class="btn sm" onclick="acceptSug()">Accepter</button><button class="btn sm sec" onclick="ignoreSug()">Ignorer</button></div></div>`;
  const al=[];
  if(c.deficit>0.0005)al.push(`<div class="card alert bad"><b>Il manque ${fmt(c.deficit)}</b><div class="mut">Tes enveloppes ne suffisent plus. Déclare une urgence (prise sur l'investissement), retarde un objet ou réduis tes dépenses.</div></div>`);
  S.objets.forEach(o=>{
    const a=c.alloue[o.id],d=c.dep[o.id];
    if(c.raw[o.id]<-0.0005){
      const fr=c.transfers.filter(t=>t.to===o.id).map(t=>esc(objById(t.from).nom)+' ('+fmt(t.m)+')').join(', ');
      const cov=c.eff[o.id]>-0.0005;
      if(cov&&!(+o.pct>0))return;
      al.push(`<div class="card alert ${cov?'':'bad'}"><b>${esc(o.nom)} : dépassé de ${fmt(-c.raw[o.id])}</b><div class="mut">${fr?'Couvert par : '+fr:'Non couvert'}</div></div>`);
    }else if(a>0&&d/a>=0.8)al.push(`<div class="card alert"><b>${esc(o.nom)} : ${Math.round(d/a*100)}% utilisé</b><div class="mut">Reste ${fmt(c.raw[o.id])}</div></div>`);
  });
  if(S.tx.length>4&&Date.now()-(S.lastBackup||S.created)>7*DAY)al.push(`<div class="card alert info"><b>💾 Pense à faire une sauvegarde</b><div class="mut">Réglages → Sauvegarde. Ça protège tes données si le navigateur est vidé.</div></div>`);
  if(al.length)h+='<h2>Alertes</h2>'+al.join('');
  h+='<h2>Mes objets</h2>';
  [...S.objets].sort((a,b)=>a.prio-b.prio||b.pct-a.pct).forEach(o=>{
    const a=c.alloue[o.id],e=c.eff[o.id],r=a>0?Math.max(0,Math.min(1,e/a)):(e>0?1:0);
    let ech='';
    if(o.echeance){const dl=Math.ceil((new Date(o.echeance+'T23:59')-Date.now())/DAY);
      ech=`<div class="mut">⏳ Échéance ${fdate(o.echeance)} (${dl>=0?dl+' j':'dépassée'})`;
      if(+o.cible>0){const m=Math.max(0,o.cible-e);ech+=` · objectif ${fmt(o.cible)} · manque ${fmt(m)}${dl>0&&m>0?' · ≈ '+fmt(m/dl*7)+'/semaine':''}`}
      ech+='</div>'}
    else if(+o.cible>0){ech=`<div class="mut">🎯 Objectif ${fmt(o.cible)} · manque ${fmt(Math.max(0,o.cible-e))}</div>`}
    h+=`<div class="card"><div class="row"><b>${esc(o.nom)}</b><span>${prioBadge(o.prio)} <span class="badge">${+o.pct}%</span></span></div>
    <div class="bar"><i style="width:${(r*100).toFixed(0)}%;background:${barColor(r)}"></i></div>
    <div class="row mut"><span>Reste <b style="color:var(--tx)">${fmt(e)}</b></span><span>Dépensé ${fmt(c.dep[o.id])} / ${fmt(a)}</span></div>${ech}</div>`;
  });
  h+=`<button class="btn" onclick="go('add')">+ Déclarer une dépense ou un revenu</button>`;
  return h;
}
function acceptSug(){
  const sug=suggestion();if(!sug)return;
  sug.forEach(x=>{const o=objById(x.id);if(o)o.pct=x.sug});
  const re=$('#sugReeq')&&$('#sugReeq').checked;
  if(re)rebalance('Rééquilibrage (suggestion acceptée)');
  S.lastAdjust=Date.now();save();toast('Pourcentages mis à jour');render();
}
function ignoreSug(){S.lastAdjust=Date.now();save();toast('Suggestion ignorée pour 7 jours');render()}

/* Déclarer */
const F={type:'depense',hors:false};
function addHTML(){
  const opts=[...S.objets].sort((a,b)=>a.prio-b.prio).map(o=>`<option value="${o.id}">${esc(o.nom)}</option>`).join('');
  const horsNames=[...new Set(S.tx.filter(t=>t.hors&&t.objNom).map(t=>t.objNom))];
  return `<div class="card">
  <div class="seg" id="segType"><button data-v="depense" class="${F.type==='depense'?'on':''}">Dépense</button><button data-v="revenu" class="${F.type==='revenu'?'on':''}">Revenu</button></div>
  <label>Montant (dt)</label><input id="fM" class="amount" inputmode="decimal" placeholder="0,000" autocomplete="off">
  <label>Ça compte dans le budget ?</label>
  <div class="seg" id="segHors"><button data-v="0" class="${!F.hors?'on':''}">Dans le budget</button><button data-v="1" class="${F.hors?'on':''}">Hors budget</button></div>
  <div id="bObj"><label>Objet</label><select id="fObj">${opts}<option value="__new">+ Nouvel objet…</option></select></div>
  <div id="bNew" hidden><label>Nom du nouvel objet</label><input id="fNewNom" placeholder="ex. Cadeau, Livre…">
    <label>Priorité</label><select id="fNewPrio"><option value="1">1 – essentiel</option><option value="2" selected>2 – important</option><option value="3">3 – plaisir</option></select>
    <div class="mut" style="margin-top:6px">Il démarre à 0 % : la dépense sera couverte par « Imprévus ». Tu pourras lui donner un % dans Réglages.</div></div>
  <div id="bHorsNom" hidden><label>Objet (pour l'historique)</label><input id="fHorsNom" list="dlHors" placeholder="ex. Vêtements, Téléphone…"><datalist id="dlHors">${horsNames.map(n=>`<option value="${esc(n)}">`).join('')}${S.objets.map(o=>`<option value="${esc(o.nom)}">`).join('')}</datalist></div>
  <label class="chk" id="bUrg"><input type="checkbox" id="fUrg"><span><b>Urgence</b> : prendre dans l'investissement (sera remboursé automatiquement)</span></label>
  <div id="bPrev" class="prev card" style="background:var(--soft);border:0" hidden></div>
  <div class="o3"><div><label>Date</label><input type="date" id="fDate" value="${todayISO()}"></div><div><label>Note (facultatif)</label><input id="fNote" placeholder="…"></div></div>
  <button class="btn" id="fSave">Enregistrer</button></div>`;
}
function bindAdd(){
  const upd=()=>{
    const dep=F.type==='depense',inB=!F.hors;
    $('#bObj').hidden=!(dep&&inB);
    $('#bNew').hidden=!(dep&&inB&&$('#fObj').value==='__new');
    $('#bHorsNom').hidden=inB;
    $('#bUrg').hidden=!(dep&&inB);
    const p=$('#bPrev'),m=num($('#fM').value);
    if(!dep&&inB&&m>0){
      const a=allocate(S,m,compute(S).dette);
      p.hidden=false;
      p.innerHTML='<b>Répartition prévue</b>'+`<div><span>Investissement (${S.investPct}%)</span><b>${fmt(a.invest)}</b></div>`+(a.refund>0?`<div><span>Remboursement urgence</span><b>${fmt(a.refund)}</b></div>`:'')+
        S.objets.filter(o=>a.obj[o.id]).map(o=>`<div><span>${esc(o.nom)}</span><span>${fmt(a.obj[o.id])}</span></div>`).join('');
    }else p.hidden=true;
  };
  $('#segType').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.type=b.dataset.v;[...$('#segType').children].forEach(x=>x.classList.toggle('on',x===b));upd()};
  $('#segHors').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.hors=b.dataset.v==='1';[...$('#segHors').children].forEach(x=>x.classList.toggle('on',x===b));upd()};
  $('#fObj').onchange=upd;$('#fM').oninput=upd;
  $('#fSave').onclick=saveTx;
  upd();setTimeout(()=>{const e=$('#fM');if(e)e.focus()},50);
}
function saveTx(){
  const m=r3(num($('#fM').value));
  if(!(m>0)){toast('Entre un montant valide');return}
  const date=$('#fDate').value||todayISO(),note=$('#fNote').value.trim();
  const t={id:uid(),ts:tsFor(date),date,type:F.type,montant:m,hors:F.hors,note};
  let msg='Enregistré ✔';
  if(F.hors){
    const n=$('#fHorsNom').value.trim();if(!n){toast("Indique l'objet hors budget");return}
    t.objNom=n;msg='Hors budget enregistré ✔';
  }else if(F.type==='revenu'){
    t.alloc=allocate(S,m,compute(S).dette);msg='Revenu réparti ✔';
  }else{
    let id=$('#fObj').value;
    if(id==='__new'){
      const n=$('#fNewNom').value.trim();if(!n){toast('Donne un nom au nouvel objet');return}
      const ex=S.objets.find(o=>o.nom.toLowerCase()===n.toLowerCase());
      if(ex)id=ex.id;else{id=uid();S.objets.push({id,nom:n,pct:0,prio:+$('#fNewPrio').value})}
    }
    t.obj=id;t.objNom=objById(id).nom;
    if($('#fUrg').checked){t.urgence=true;msg="Pris dans l'investissement — remboursement automatique"}
  }
  S.tx.push(t);save();
  $('#fM').value='';$('#fNote').value='';
  toast(msg);go('home');
}

/* Historique */
let HF={f:'all',o:''};
function histHTML(){
  let list=[...S.tx].sort((a,b)=>b.ts-a.ts);
  if(HF.f==='in')list=list.filter(t=>!t.hors);
  if(HF.f==='out')list=list.filter(t=>t.hors);
  if(HF.f==='urg')list=list.filter(t=>t.urgence);
  if(HF.o)list=list.filter(t=>(t.obj===HF.o)||(t.hors&&t.objNom===HF.o));
  const names=[...S.objets.map(o=>({v:o.id,n:o.nom})),...[...new Set(S.tx.filter(t=>t.hors&&t.objNom).map(t=>t.objNom))].map(n=>({v:n,n:n+' (hors budget)'}))];
  let tot=0;list.forEach(t=>{if(t.type==='revenu')tot+=t.montant;else if(t.type==='depense')tot-=t.montant});
  let h=`<div class="chips">${[['all','Tout'],['in','Budget'],['out','Hors budget'],['urg','Urgences']].map(([k,l])=>`<button class="${HF.f===k?'on':''}" onclick="HF.f='${k}';render()">${l}</button>`).join('')}</div>
  <select onchange="HF.o=this.value;render()"><option value="">Tous les objets</option>${names.map(x=>`<option value="${esc(x.v)}" ${HF.o===x.v?'selected':''}>${esc(x.n)}</option>`).join('')}</select>
  <div class="card"><div class="row mut"><span>${list.length} opérations</span><span>Solde du filtre : <b style="color:var(--tx)">${fmt(tot)}</b></span></div>`;
  if(!list.length)h+='<div class="mut" style="padding:16px 0;text-align:center">Rien à afficher</div>';
  list.forEach(t=>{
    let label,amt;
    if(t.type==='revenu'){label=t.hors?'Revenu – '+esc(t.objNom):'Revenu';amt=`<span class="pos">+${fmt(t.montant)}</span>`}
    else if(t.type==='depense'){const o=objById(t.obj);label=esc(o?o.nom:(t.objNom||'(objet supprimé)'));amt=`<span class="neg">−${fmt(t.montant)}</span>`}
    else{label='⚖️ Rééquilibrage';amt='<span class="mut">—</span>'}
    const badges=(t.hors?'<span class="badge hb">Hors budget</span> ':'')+(t.urgence?'<span class="badge urg">Urgence</span>':'');
    h+=`<div class="tx"><div class="l"><b>${label}</b><span class="mut">${fdate(t.date)}${t.note?' · '+esc(t.note):''}</span> ${badges}</div>${amt}<button class="del" onclick="delTx(this,'${t.id}')">🗑</button></div>`;
  });
  return h+'</div>';
}
function delTx(btn,id){
  if(!btn.classList.contains('confirm')){btn.classList.add('confirm');btn.textContent='Supprimer ?';setTimeout(()=>{if(btn.isConnected){btn.classList.remove('confirm');btn.textContent='🗑'}},3000);return}
  S.tx=S.tx.filter(t=>t.id!==id);save();toast('Supprimé');render();
}

/* Analyse */
function statsHTML(){
  const c=compute(S);
  const since=S.lastAdjust,deps=S.tx.filter(t=>t.type==='depense'&&!t.hors);
  const tot=deps.reduce((a,t)=>a+t.montant,0),sum=sumPct(S);
  const days=Math.max(1,(Date.now()-Math.min(S.created,...S.tx.map(t=>t.ts)))/DAY);
  let h=`<div class="card"><b>Consommation réelle vs prévue</b><div class="mut">Toutes les dépenses dans le budget (${fmt(tot)} sur ${Math.round(days)} jour(s))</div><table style="margin-top:8px">
  <tr class="mut"><td>Objet</td><td>Prévu</td><td>Réel</td></tr>`;
  S.objets.forEach(o=>{const d=c.dep[o.id]+c.depUrg[o.id],real=tot>0?d/tot*sum:0;h+=`<tr><td>${esc(o.nom)}</td><td>${+o.pct}%</td><td><b>${tot>0?real.toFixed(1)+'%':'—'}</b></td></tr>`});
  h+=`</table><div class="mut" style="margin-top:8px">Le « réel » est ramené sur les ${sum}% des objets (l'investissement reste à ${S.investPct}%).</div></div>`;
  // hors budget
  const hb={};S.tx.filter(t=>t.hors).forEach(t=>{const k=t.objNom||'?';hb[k]=hb[k]||{dep:0,rev:0,n:0};hb[k][t.type==='revenu'?'rev':'dep']+=t.montant;hb[k].n++});
  h+=`<div class="card"><b>Hors budget (pour ton futur programme)</b>`;
  const ks=Object.keys(hb);
  if(!ks.length)h+='<div class="mut">Aucune opération hors budget pour l\'instant.</div>';
  else{h+='<table style="margin-top:8px"><tr class="mut"><td>Objet</td><td>Dépensé</td><td>Reçu</td></tr>'+ks.sort((a,b)=>hb[b].dep-hb[a].dep).map(k=>`<tr><td>${esc(k)}</td><td>${fmt(hb[k].dep)}</td><td>${fmt(hb[k].rev)}</td></tr>`).join('')+'</table>'}
  h+='</div>';
  h+=`<div class="card"><b>🤖 Export pour Claude</b><div class="mut">Copie ce texte et colle-le dans la conversation pour que j'analyse ta consommation et ajuste les pourcentages.</div>
  <button class="btn" onclick="shareExport()">📤 Partager vers Claude</button>
  <div class="o3"><button class="btn sm sec" onclick="copyText(exportText())">Copier</button><button class="btn sm sec" onclick="dl('pocket-money-export-'+todayISO()+'.txt',exportText(),'text/plain')">Fichier .txt</button></div>
  <details style="margin-top:10px"><summary class="mut">Voir le texte</summary><textarea id="exp" readonly>${esc(exportText())}</textarea></details></div>`;
  return h;
}
function exportText(){
  const c=compute(S),L=[];
  L.push('EXPORT POCKET MONEY — '+new Date().toLocaleString('fr-FR'));
  L.push(`Paramètres : investissement ${S.investPct}% · remboursement urgences ${S.refundPct}% · économies de départ ${fmt(S.investInit)}`);
  L.push(`Disponible : ${fmt(c.dispo)} · Investissement : ${fmt(c.invest)} · Dette urgences : ${fmt(c.dette)}`);
  L.push('','OBJETS (nom | priorité | % | alloué | dépensé | reste | échéance/objectif)');
  S.objets.forEach(o=>L.push(`- ${o.nom} | P${o.prio} | ${o.pct}% | ${fmt(c.alloue[o.id])} | ${fmt(c.dep[o.id])} | ${fmt(c.eff[o.id])}${o.echeance?' | éch. '+o.echeance:''}${+o.cible>0?' | obj. '+fmt(o.cible):''}`));
  L.push('','HISTORIQUE (date | type | objet | montant | budget | note)');
  [...S.tx].sort((a,b)=>a.ts-b.ts).forEach(t=>{
    if(t.type==='reeq'){L.push(`${t.date} | rééquilibrage | — | — | budget | ${t.note||''}`);return}
    const o=t.obj?objById(t.obj):null;
    L.push(`${t.date} | ${t.type}${t.urgence?' (urgence)':''} | ${o?o.nom:(t.objNom||'—')} | ${t.type==='revenu'?'+':'-'}${r3(t.montant)} | ${t.hors?'HORS':'budget'} | ${t.note||''}`);
  });
  return L.join('\n');
}

/* Réglages */
let resetArm=false;
function setHTML(){
  const sum=sumPct(S),tot=sum+(+S.investPct);
  let h=`<div class="card"><b>Investissement</b><div class="o3"><div><label>% de chaque revenu</label><input id="sInv" inputmode="decimal" value="${S.investPct}"></div><div><label>% remboursement urgence</label><input id="sRef" inputmode="decimal" value="${S.refundPct}"></div></div>
  <label>Économies de départ (boîte) (dt)</label><input id="sInit" inputmode="decimal" value="${S.investInit}"></div>
  <h2>Objets</h2><div class="mut" style="margin:0 4px">Total objets ${sum}% + investissement ${S.investPct}% = <b style="color:${Math.abs(tot-100)<0.01?'var(--ok)':'var(--warn)'}">${tot}%</b>${Math.abs(tot-100)<0.01?' ✔':' (idéalement 100 %)'}</div>`;
  S.objets.forEach((o,i)=>{
    const used=S.tx.some(t=>t.obj===o.id);
    h+=`<div class="card" data-i="${i}"><input class="oNom" value="${esc(o.nom)}" style="font-weight:700">
    <div class="o3"><div><label>%</label><input class="oPct" inputmode="decimal" value="${o.pct}"></div><div><label>Priorité</label><select class="oPrio">${[1,2,3].map(p=>`<option ${o.prio==p?'selected':''}>${p}</option>`).join('')}</select></div></div>
    <div class="o3"><div><label>Échéance</label><input type="date" class="oEch" value="${o.echeance||''}"></div><div><label>Objectif (dt)</label><input class="oCib" inputmode="decimal" value="${o.cible||''}" placeholder="facultatif"></div></div>
    ${o.imprevu?'<div class="mut" style="margin-top:6px">Objet « Imprévus » : il couvre en premier les dépassements et les nouveaux objets.</div>':used?'<div class="mut" style="margin-top:6px">Utilisé dans l\'historique (mets 0 % pour ne plus l\'alimenter).</div>':`<button class="btn sm sec" onclick="delObj(${i})">Supprimer cet objet</button>`}</div>`;
  });
  h+=`<button class="btn sec" onclick="addObj()">+ Ajouter un objet</button>
  <label class="chk"><input type="checkbox" id="sReeq"> Appliquer les nouveaux % à l'argent disponible maintenant (sinon : seulement aux prochains revenus)</label>
  <button class="btn" onclick="saveSet()">Enregistrer les réglages</button>
  <h2>Sauvegarde</h2><div class="card"><div class="mut">Copie ce code et garde-le (notes, WhatsApp à toi-même…). Il permet de tout restaurer.</div>
  <div class="o3"><button class="btn sm" onclick="backup('file')">💾 Fichier</button><button class="btn sm" onclick="backup('copy')">Copier le code</button></div>
  <label>Restaurer depuis un fichier</label><input type="file" accept=".json,application/json,text/plain" onchange="importFile(this)">
  <label>…ou colle un code de sauvegarde</label><textarea id="imp" placeholder='{"v":1,...}'></textarea><button class="btn sm sec" onclick="importBk()">Restaurer</button></div>
  <h2>Zone sensible</h2><div class="card"><button class="btn danger sm" onclick="resetAll(this)">${resetArm?'Appuie encore pour tout effacer':'Tout réinitialiser'}</button></div>`;
  return h;
}
function readSetForm(){
  document.querySelectorAll('[data-i]').forEach(card=>{
    const o=S.objets[+card.dataset.i];if(!o)return;
    o.nom=card.querySelector('.oNom').value.trim()||o.nom;
    const p=num(card.querySelector('.oPct').value);o.pct=isFinite(p)&&p>=0?p:0;
    o.prio=+card.querySelector('.oPrio').value;
    o.echeance=card.querySelector('.oEch').value||'';
    const cb=num(card.querySelector('.oCib').value);o.cible=cb>0?cb:'';
  });
  const inv=num($('#sInv').value),ref=num($('#sRef').value),ini=num($('#sInit').value);
  if(inv>=0&&inv<=100)S.investPct=inv;if(ref>=0&&ref<=100)S.refundPct=ref;if(ini>=0)S.investInit=ini;
}
function saveSet(){readSetForm();if($('#sReeq').checked)rebalance('Rééquilibrage (réglages)');S.lastAdjust=Date.now();save();toast('Réglages enregistrés');render()}
function addObj(){readSetForm();S.objets.push({id:uid(),nom:'Nouvel objet',pct:0,prio:3});save();render();window.scrollTo(0,document.body.scrollHeight)}
function delObj(i){readSetForm();S.objets.splice(i,1);save();render()}
function backup(how){S.lastBackup=Date.now();save();const j=JSON.stringify(S);if(how==='file')dl('pocket-money-sauvegarde-'+todayISO()+'.json',j,'application/json');else copyText(j)}
function dl(name,txt,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Fichier enregistré dans Téléchargements')}catch(e){toast('Téléchargement impossible ici')}}
async function shareExport(){const t=exportText();if(navigator.share){try{await navigator.share({title:'Export Pocket Money',text:t});return}catch(e){if(e&&e.name==='AbortError')return}}copyText(t)}
function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;f.text().then(txt=>{$('#imp').value=txt;importBk()})}
function importBk(){
  try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.objets)||!Array.isArray(d.tx))throw 0;S=d;save();toast('Données restaurées ✔');go('home')}
  catch(e){toast('Sauvegarde invalide')}
}
function resetAll(){if(!resetArm){resetArm=true;render();setTimeout(()=>{resetArm=false;if(tab==='set')render()},4000);return}resetArm=false;S=initial();save();toast('Réinitialisé');go('home')}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
S=load()||initial();
save();
render();
</script>
</body>
</html>
